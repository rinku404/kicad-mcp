[project]
name = "kicad-mcp"
version = "0.2.0"
description = "MCP server that lets LLMs read, check and work with KiCad projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Paulo" }]
keywords = ["kicad", "mcp", "eda", "llm", "pcb", "schematic"]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kicad-mcp = "kicad_mcp.server:main"

[project.urls]
Repository = "https://github.com/rinku404/kicad-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
